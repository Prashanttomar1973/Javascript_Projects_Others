<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissor Game</title>
    <link rel="stylesheet" href="../Rock_Paper_Scissor/style.css">
</head> 
<body>
    
    <h1 id="top-heading">Rock Paper Scissor</h1>
    
    <div class="choices">

    <div class="choice" id="rock">
        <img   src="..\Rock_Paper_Scissor\images\image.png" alt="rock-image">
    </div>

    <div class="choice" id="paper">
        <img  src="..\Rock_Paper_Scissor\images\image copy.png" alt="paper-image">
    </div>

    <div class="choice" id="scissor">
        <img  src="../Rock_Paper_Scissor/images/image copy 2.png" alt="scissor-image">
    </div>

    </div>
    
<!-- Scores -->
    <div class="score-board">
        <div class="score">
            <p id="user-score">0</p>
             <p>You</p>
        </div>

        <div class="score">
            <p id="comp-score">0</p>
             <p>Comp</p>
        </div>
    </div>

<!-- Bottom Text  -->
  <div class="msg-container">
    <p id="msg">Play your move</p>
  </div>

  <script src="..\Rock_Paper_Scissor\app.js"></script>
</body>
</html>
